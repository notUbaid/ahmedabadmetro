<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Ahmedabad Metro - Route Planner & Live Tracking</title>
    <meta name="title" content="Ahmedabad Metro - Route Planner & Live Tracking" />
    <meta name="description" content="Plan your Ahmedabad Metro journey with real-time train tracking, route planning, and live arrival times. Works offline!" />
    <meta name="keywords" content="Ahmedabad Metro, Gujarat Metro, Route Planner, Train Timing, GIFT City Metro, Gandhinagar Metro" />
    <meta name="author" content="AhmMetro" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0066CC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AhmMetro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AhmMetro" />
    <meta name="msapplication-TileColor" content="#0066CC" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="mask-icon" href="/pwa-512x512.png" color="#0066CC" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ahmmetro.app/" />
    <meta property="og:title" content="Ahmedabad Metro - Route Planner & Live Tracking" />
    <meta property="og:description" content="Plan your Ahmedabad Metro journey with real-time train tracking, route planning, and live arrival times. Works offline!" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="AhmMetro" />
    <meta property="og:locale" content="en_IN" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ahmmetro.app/" />
    <meta name="twitter:title" content="Ahmedabad Metro - Route Planner & Live Tracking" />
    <meta name="twitter:description" content="Plan your Ahmedabad Metro journey with real-time train tracking, route planning, and live arrival times. Works offline!" />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ahmedabad Metro",
      "alternateName": "AhmMetro",
      "description": "Plan your Ahmedabad Metro journey with real-time train tracking, route planning, and live arrival times.",
      "url": "https://ahmmetro.app",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1000"
      },
      "author": {
        "@type": "Organization",
        "name": "AhmMetro"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; text-align: center; background: #0f172a; color: white; }
      </style>
      <h1>Ahmedabad Metro</h1>
      <p>Please enable JavaScript to use this app.</p>
    </noscript>
  </body>
</html>
